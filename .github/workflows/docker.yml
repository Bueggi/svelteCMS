name: Build & publish Docker image

# Publishes ghcr.io/<owner>/<repo> (the image deploy/docker/docker-compose.yml pulls).
# After the first run, set the package to "Public" (GitHub → Packages → Package settings)
# so customers' servers can pull it without a login.

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - 'latest.json'
      - '**.md'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hetzner sells x86 (CX/CPX) and ARM (CAX) servers — publish both
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
