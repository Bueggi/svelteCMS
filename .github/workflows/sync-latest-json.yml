name: Sync latest.json to Gist

on:
  push:
    branches: [master]
    paths:
      - latest.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Gist
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          content=$(cat latest.json)
          curl -s -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/gists/c0e4f9ffd43e7f6251758d6f7df81b97 \
            -d "{\"files\":{\"latest.json\":{\"content\":$(echo "$content" | jq -Rs .)}}}"
