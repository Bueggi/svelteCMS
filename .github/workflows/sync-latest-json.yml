name: Sync latest.json to Gist

on:
  push:
    branches: [master]
    paths:
      - latest.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Gist
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          content=$(cat latest.json)
          body=$(jq -n --arg c "$content" '{files:{"latest.json":{content:$c}}}')
          echo "Request body: $body"
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/gists/c0e4f9ffd43e7f6251758d6f7df81b97 \
            -d "$body")
          echo "Response: $response"
          status=$(echo "$response" | grep HTTP_STATUS | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "::error::Gist update failed with status $status"
            exit 1
          fi
