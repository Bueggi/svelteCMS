name: Sync latest.json to Gist

on:
  push:
    branches: [master]
    paths:
      - latest.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest.json and update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
        run: |
          # Fetch latest.json from the repo via API (no checkout needed)
          content=$(curl -sS \
            -H "Authorization: token $REPO_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/latest.json?ref=${{ github.sha }}")
          echo "Fetched content: $content"

          body=$(jq -n --arg c "$content" '{files:{"latest.json":{content:$c}}}')
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/gists/c0e4f9ffd43e7f6251758d6f7df81b97 \
            -d "$body")
          echo "Response: $response"
          status=$(echo "$response" | grep HTTP_STATUS | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "::error::Gist update failed with status $status"
            exit 1
          fi
