# /etc/nginx/sites-available/lumiere
# Nach Änderungen: sudo nginx -t && sudo systemctl reload nginx

upstream lumiere_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name deine-domain.de www.deine-domain.de;
    # Certbot/Let's Encrypt ergänzt hier automatisch den HTTPS-Block

    # ── Uploads direkt vom Filesystem ──────────────────────────────
    location /uploads/ {
        alias /var/www/lumiere/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SvelteKit Node.js App ───────────────────────────────────────
    location / {
        proxy_pass http://lumiere_app;
        proxy_http_version 1.1;

        # WebSocket-Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Korrekte Headers weiterleiten
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts — Node.js hat Zeit zum Antworten
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # File-Uploads bis 20 MB
        client_max_body_size 20M;

        # Wenn der upstream kurz nicht erreichbar ist (z.B. PM2 reload),
        # probiert Nginx es einmal mit dem nächsten upstream erneut.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    # ── Eigene 502/503 Fehlerseite ──────────────────────────────────
    error_page 502 503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/lumiere/static;
        internal;
        # Fallback falls die Datei nicht existiert:
        try_files /maintenance.html @maintenance_fallback;
    }
    location @maintenance_fallback {
        return 503 '<html><head><meta http-equiv="refresh" content="5"><title>Kurz offline</title></head><body style="font-family:sans-serif;text-align:center;padding:4rem"><h2>Gleich wieder da</h2><p>Die Seite wird neu gestartet. Bitte warte kurz...</p></body></html>';
        add_header Content-Type text/html;
    }
}
