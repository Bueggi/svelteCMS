server {
    listen 80;
    server_name deine-domain.de www.deine-domain.de;

    # Lass Certbot/Let's Encrypt hier arbeiten (wird automatisch ergänzt)

    # Uploads direkt vom Filesystem servieren — Node.js wird dabei NICHT angetastet
    location /uploads/ {
        alias /var/www/lumiere/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Nur Bilder erlauben
        location ~* \.(jpg|jpeg|png|webp|gif|svg)$ {
            try_files $uri =404;
        }
    }

    # Alles andere an die SvelteKit Node.js App
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Für File-Uploads: erhöhe das Body-Limit
        client_max_body_size 10M;
    }
}
